apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-api
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: sentiment-api
  template:
    metadata:
      labels:
        app: sentiment-api
    spec:
      containers:
        - name: sentiment-api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000
          env:
            - name: MODEL_VERSION
              value: VERSION_PLACEHOLDER
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-api
spec:
  type: NodePort
  selector:
    app: sentiment-api
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentiment-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentiment-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70