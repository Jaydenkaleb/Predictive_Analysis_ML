name: Sentiment API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sentiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t sentiment-api:test .

      - name: Test API inside the container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            --entrypoint sh \
            sentiment-api:test \
            -c "pip install pytest==8.3.5 && python -m pytest -q tests"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/sentiment-api:${GITHUB_SHA}"
          docker tag sentiment-api:test "$IMAGE"
          docker push "$IMAGE"

  deploy:
    needs: test-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, local-k8s]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy exact image version
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $image = "$env:DOCKERHUB_USERNAME/sentiment-api:$env:GITHUB_SHA"
          $manifest = Get-Content k8s/deployment.yaml -Raw
          $manifest = $manifest.Replace("IMAGE_PLACEHOLDER", $image)
          $manifest = $manifest.Replace("VERSION_PLACEHOLDER", $env:GITHUB_SHA)
          $manifest | Set-Content rendered-deployment.yaml

          kubectl --context docker-desktop apply -f rendered-deployment.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl --context docker-desktop rollout status deployment/sentiment-api --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }